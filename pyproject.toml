[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TPWUtils"
version = "0.1.0"
description = "A collection of Python 3 utilities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Pat Welch", email = "pat@mousebrains.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "pyinotify; sys_platform == 'linux'",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
database = [
    "psycopg>=3.0",
]
analysis = [
    "pandas",
    "xarray",
]

[project.urls]
Homepage = "https://github.com/mousebrains/TPWUtils"
Repository = "https://github.com/mousebrains/TPWUtils"
Issues = "https://github.com/mousebrains/TPWUtils/issues"

[tool.setuptools]
packages = ["TPWUtils"]
